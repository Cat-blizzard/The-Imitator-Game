[build-system]
requires = ["setuptools>=62.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imitator-game"
version = "2.0.0.dev0"
description = "The Imitator Game 2.0: a benchmark for robot imitation from human videos (ManiSkill-based simulation, multi-embodiment tasks, verified success contracts, data engine)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
# Simulator and benchmark only. The 1.0 policy baselines (and their dependencies) stay on the `main` branch.
dependencies = [
    "sapien>=3.0.0.b1; platform_system=='Linux' or platform_system=='Windows'",
    "numpy>=1.22.4,<2.0.0",
    "scipy>=1.9.1",
    "gymnasium==0.29.1",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "h5py",
    "pyyaml",
    "tqdm>=4.64.1",
    "GitPython",
    "tabulate",
    "transforms3d",
    "trimesh",
    "imageio>=2.36.1",
    "imageio[ffmpeg]",
    "opencv-python>=4.10.0.84",
    "pillow>=11.0.0",
    "matplotlib>=3.6.1",
    "mplib==0.1.1; platform_system=='Linux'",
    "fast_kinematics==0.2.2; platform_system=='Linux'",
    "pytorch_kinematics==0.7.5",
    "IPython",
    "pynvml",
    "psutil>=5.9.2",
    "tyro>=0.9.5",
    "huggingface_hub",
    "dacite",
    "pandas",
]

[project.optional-dependencies]
# IG-10K LeRobot datasets (conversion, loaders) and the human-video evaluation (imitator.eval.run)
dataset = ["lerobot==0.5.0", "av>=10.0.0,<16.0.0", "albumentations>=2.0.8", "fsspec[gcs]>=2024.6.0"]
# soft bodies (Newton VBD cloth bridge), Newton ray-cast camera, MuJoCo-Warp route B
soft = ["newton==1.7.0", "warp-lang==1.19.0", "mujoco-warp==3.15.0"]
# optional real -> sim -> human pipeline (real2sim/, vendored ReSimPair); versions as in its requirements.lock
real2sim = ["jsonschema==4.26.0", "referencing==0.37.0", "av==15.1.0", "coacd==1.0.7", "embreex==4.4.0.post1", "requests", "pyyaml",
            "scipy", "trimesh", "opencv-python", "imageio[ffmpeg]"]
# PartNet-Mobility download helper (mani_skill/utils/download_partnet.py)
partnet = ["selenium>=4.39.0"]
dev = ["pytest>=8.3.4", "ruff>=0.8.6"]

[project.scripts]
imitator = "imitator.__main__:main"
veritask = "veritask.cli:main"

[project.urls]
Website = "https://imitator-game.github.io"
Repository = "https://github.com/Zhouxunzhe/The-Imitator-Game"

[tool.uv]
prerelease = "allow"
override-dependencies = ["gymnasium==0.29.1", "numpy>=1.22.4,<2.0.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mani_skill", "real2sim"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",
    "T201",
    "PD008",
    "ISC001",
    "LOG015",
]
unfixable = [
    "B905",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mani_skill*", "imitator*", "veritask*"]

[tool.setuptools.package-data]
mani_skill = ["assets/**", "envs/**/*", "utils/**/*"]
imitator = ["assets/**", "contracts/*.json", "soft/contracts/*.json", "planning/*.json", "verify/*.json",
            "embodiments/calibration/*.json", "dataset/config/**", "dataset/task_desc/**", "dataset/task_mapping.json",
            "eval/lists/**"]
veritask = ["tasks/**", "spec/*.json", "data/examples/*.json"]