[build-system]
requires = ["setuptools>=62.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imitator-game"
version = "2.0.0.dev0"
description = "The Imitator Game 2.0: a benchmark for robot imitation from human videos (ManiSkill-based simulation, multi-embodiment tasks, verified success contracts, data engine)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
# Simulator, benchmark, evaluation; extras: dataset (IG-10K), baselines (1.0 policy baselines), soft, real2sim.
dependencies = [
    "sapien>=3.0.0.b1; platform_system=='Linux' or platform_system=='Windows'",
    "numpy>=1.22.4,<2.0.0",
    "scipy>=1.9.1",
    "gymnasium==0.29.1",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "h5py",
    "pyyaml",
    "tqdm>=4.64.1",
    "GitPython",
    "tabulate",
    "transforms3d",
    "trimesh",
    "imageio>=2.36.1",
    "imageio[ffmpeg]",
    "opencv-python>=4.10.0.84",
    "pillow>=11.0.0",
    "matplotlib>=3.6.1",
    "mplib==0.1.1; platform_system=='Linux'",
    "fast_kinematics==0.2.2; platform_system=='Linux'",
    "pytorch_kinematics==0.7.5",
    "IPython",
    "pynvml",
    "psutil>=5.9.2",
    "tyro>=0.9.5",
    "huggingface_hub",
    "dacite",
    "pandas",
]

[project.optional-dependencies]
# IG-10K LeRobot datasets (conversion, loaders) and the human-video evaluation (imitator.eval.run)
dataset = ["lerobot==0.5.0", "av>=10.0.0,<16.0.0", "albumentations>=2.0.8", "fsspec[gcs]>=2024.6.0"]
# soft bodies (Newton VBD cloth bridge), Newton ray-cast camera, MuJoCo-Warp route B
soft = ["newton==1.7.0", "warp-lang==1.19.0", "mujoco-warp==3.15.0"]
# optional real -> sim -> human pipeline (real2sim/, vendored ReSimPair); versions as in its requirements.lock
real2sim = ["jsonschema==4.26.0", "referencing==0.37.0", "av==15.1.0", "coacd==1.0.7", "embreex==4.4.0.post1", "requests", "pyyaml",
            "scipy", "trimesh", "opencv-python", "imageio[ffmpeg]"]
# 1.0 policy baselines (examples/baselines: ACT, Diffusion Policy, VQ-BeT, UniSkill, XSkill, GR00T, RDT, pi0.5,
# OpenVLA-OFT, HyperICL): training and evaluation, versions as on `main`
baselines = [
    "imitator-game[dataset]",
    "torch==2.7.1",
    "accelerate>=1.10.1",
    "augmax>=0.3.4",
    "r3m",
    "beartype==0.19.0",
    "bitsandbytes>=0.48.1",
    "blobfile>=3.1.0",
    "deepspeed>=0.18.0",
    "diffusers>=0.36.0",
    "dm-control>=1.0.9",
    "dm-tree>=0.1.8",
    "draccus>=0.11.5",
    "einops>=0.8.1",
    "equinox>=0.11.8",
    "filelock>=3.16.1",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "gym>=0.26.2",
    "gym-aloha>=0.1.1",
    "hydra-core",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "joblib>=1.5.3",
    "json-numpy>=2.1.1",
    "jsonlines>=4.0.0",
    "lightning",
    "ml_collections==1.0.0",
    "numba>=0.56.4",
    "numcodecs>=0.10.2",
    "numpydantic>=1.6.6",
    "openai-clip>=1.0.1",
    "openpi-client",
    "orbax-checkpoint==0.11.13",
    "peft>=0.17.1",
    "plotly>=6.5.1",
    "polars>=1.30.0",
    "qwen-vl-utils<0.0.14",
    "rich>=14.0.0",
    "scikit-image>=0.19.3",
    "scikit-learn>=1.8.0",
    "scikit-video>=1.1.11",
    "sentencepiece>=0.2.1",
    "tensorboard>=2.15.0",
    "termcolor>=2.0.1",
    "tiktoken>=0.11.0",
    "timm==0.9.10",
    "tqdm-loggable>=0.2",
    "transformers>=4.52.0",
    "treescope>=0.1.7",
    "typing-extensions>=4.12.2",
    "wandb>=0.19.1",
    "zarr>=2.12.0",
    "dlimp",
    "tensorflow-cpu>=2.16.1",
    "tensorflow-datasets==4.9.9",
    "gradio>=6.3.0",
]
# PartNet-Mobility download helper (mani_skill/utils/download_partnet.py)
partnet = ["selenium>=4.39.0"]
dev = ["pytest>=8.3.4", "ruff>=0.8.6"]

[project.scripts]
imitator = "imitator.__main__:main"
veritask = "veritask.cli:main"

[project.urls]
Website = "https://imitator-game.github.io"
Repository = "https://github.com/Zhouxunzhe/The-Imitator-Game"

[tool.uv]
prerelease = "allow"
override-dependencies = [
    "ml-dtypes>=0.5.0",
    "tensorstore==0.1.74",
    "gymnasium==0.29.1",
    "draccus>=0.11.5",
    "diffusers>=0.36.0",
    "numpy>=1.22.4,<2.0.0",
    "huggingface-hub==0.33.1",
    "tensorflow>=2.16.1",
    "tensorflow-cpu>=2.16.1",
]

[tool.uv.sources]
openpi-client = { workspace = true }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }
diffusion-policy = { path = "examples/baselines/diffusion_policy", editable = true }
r3m = { git = "https://github.com/facebookresearch/r3m" }
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = ["examples/baselines/pi/packages/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mani_skill", "real2sim", "examples/baselines"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",
    "T201",
    "PD008",
    "ISC001",
    "LOG015",
]
unfixable = [
    "B905",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mani_skill*", "imitator*", "veritask*"]

[tool.setuptools.package-data]
mani_skill = ["assets/**", "envs/**/*", "utils/**/*"]
imitator = ["assets/**", "contracts/*.json", "soft/contracts/*.json", "planning/*.json", "verify/*.json",
            "embodiments/calibration/*.json", "dataset/config/**", "dataset/task_desc/**", "dataset/task_mapping.json",
            "eval/lists/**"]
veritask = ["tasks/**", "spec/*.json", "data/examples/*.json"]